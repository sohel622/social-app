name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: 🔧 Fix Workspace Config
        run: |
          echo "packages:" > pnpm-workspace.yaml
          echo "  - '.'" >> pnpm-workspace.yaml

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🔤 Compile Translations
        run: |
          pnpm intl:compile || true

      - name: ⚙️ Setup Local Environment & Google Services
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=production" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env
          
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bluesky-client",
              "storage_bucket": "bluesky-client.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "xyz.blueskyweb.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_building_apk_only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 🛠️ Neutralize All Custom Plugins & Prebuild
        run: |
          for ext in shareExtension starterPackAppClipExtension notificationsExtension; do
            for base in plugins app/plugins modules app/modules; do
              mkdir -p "$base/$ext"
              echo "module.exports = function(config) { return config; };" > "$base/$ext/withShareExtension.js"
              echo "module.exports = function(config) { return config; };" > "$base/$ext/withExtensionEntitlements.js"
              echo "module.exports = function(config) { return config; };" > "$base/$ext/withStarterPackAppClip.js"
              echo "module.exports = function(config) { return config; };" > "$base/$ext/withClipEntitlements.js"
              echo "module.exports = function(config) { return config; };" > "$base/$ext/withNotificationsExtension.js"
            done
          done

          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.config.js")) {
              let code = fs.readFileSync("app.config.js", "utf8");
              code = code.replace(/.*notificationsExtension.*/g, "");
              code = code.replace(/.*shareExtension.*/g, "");
              code = code.replace(/.*starterPackAppClipExtension.*/g, "");
              fs.writeFileSync("app.config.js", code);
            }
          ' || true

          pnpm exec expo prebuild --platform android --clean --no-install

      - name: 🔑 Configure Release Keystore
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          cd android/app
          keytool -genkey -v -keystore release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bluesky,O=Bluesky,C=US" || true
          
          # Configure build.gradle to use this keystore for release builds
          sed -i '/signingConfigs {/a \        release {\n            storeFile file("release.keystore")\n            storePassword "android"\n            keyAlias "androidreleasekey"\n            keyPassword "android"\n        }' build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle

      - name: 🔨 Build Standalone Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test -x lint -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 🚀 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Standalone-App
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

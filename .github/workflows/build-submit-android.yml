name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: 🔧 Fix Workspace Config
        run: |
          echo "packages:" > pnpm-workspace.yaml
          echo "  - '.'" >> pnpm-workspace.yaml

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🔤 Compile Translations
        run: |
          pnpm intl:compile || true

      - name: ⚙️ Setup Local Environment & Google Services
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env
          
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bluesky-client",
              "storage_bucket": "bluesky-client.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "xyz.blueskyweb.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_building_apk_only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 🛠️ Clean iOS Plugins & Prebuild Android
        run: |
          # Disable iOS AppClip plugins from crashing Android config
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.config.js")) {
              let content = fs.readFileSync("app.config.js", "utf8");
              content = content.replace(/starterPackAppClipExtension/g, "nonExistentPluginDummy");
              fs.writeFileSync("app.config.js", content);
            }
          ' || true
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: 🔑 Ensure Android Keystore & Copy Google Services
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          cd android/app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: 🔧 Fix Workspace Config
        run: |
          echo "packages:" > pnpm-workspace.yaml
          echo "  - '.'" >> pnpm-workspace.yaml

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🔤 Compile Translations
        run: |
          pnpm intl:compile || true

      - name: ⚙️ Setup Local Environment & Google Services
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env
          
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bluesky-client",
              "storage_bucket": "bluesky-client.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "xyz.blueskyweb.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_building_apk_only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 🛠️ Neutralize All Custom Plugins & Prebuild
        run: |
          create_dummy() {
            mkdir -p "$(dirname "$1")"
            cat << 'EOF' > "$1"
          const dummy = (config) => config;
          module.exports = dummy;
          module.exports.default = dummy;
          module.exports.withShareExtension = dummy;
          module.exports.withShareExtensions = dummy;
          module.exports.withExtensionEntitlements = dummy;
          module.exports.withStarterPackAppClip = dummy;
          module.exports.withClipEntitlements = dummy;
          module.exports.withNotificationsExtension = dummy;
          EOF
          }

          create_dummy "plugins/starterPackAppClipExtension/withClipEntitlements.js"
          create_dummy "plugins/starterPackAppClipExtension/withStarterPackAppClip.js"
          create_dummy "plugins/shareExtension/withShareExtension.js"
          create_dummy "plugins/shareExtension/withShareExtensions.js"
          create_dummy "plugins/shareExtension/withExtensionEntitlements.js"
          create_dummy "plugins/notificationsExtension/withNotificationsExtension.js"

          pnpm exec expo prebuild --platform android --clean --no-install

      - name: 🔑 Configure Android Directories & Keystore
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          cd android/app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: 🔨 Build Standalone APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 🚀 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Standalone-App
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

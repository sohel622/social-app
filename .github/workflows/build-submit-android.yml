name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Developer Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Setup Environment & Firebase Fake Config
        run: |
          cp .env.example .env || touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          if [ -f google-services.json.example ]; then
            cp google-services.json.example google-services.json
          elif [ -f android/app/google-services.json.example ]; then
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: 🛠️ Generate Native Android Project
        run: pnpm exec expo prebuild --platform android --clean

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: ⚙️ Setup Environment
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env

      - name: 🛠️ Prebuild Android
        run: |
          pnpm dlx expo prebuild --platform android --clean --no-install

      - name: 🔑 Setup Debug Keystore
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Android.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

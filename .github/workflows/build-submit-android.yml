name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🔤 Compile Translations
        run: |
          pnpm intl:compile || true

      - name: ⚙️ Setup Local Environment
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env

      - name: 🛠️ Prebuild Android Project
        run: |
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: 🔑 Ensure Android Keystore
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

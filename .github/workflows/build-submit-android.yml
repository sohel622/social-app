name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: 🔧 Fix Workspace Config
        run: |
          echo "packages:" > pnpm-workspace.yaml
          echo "  - '.'" >> pnpm-workspace.yaml

      - name: 📥 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🔤 Compile Translations
        run: |
          pnpm intl:compile || true

      - name: ⚙️ Setup Local Environment & Google Services
        run: |
          touch .env
          echo "EXPO_PUBLIC_ENV=development" >> .env
          echo "BSKY_SERVICE=https://bsky.social" >> .env
          
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bluesky-client",
              "storage_bucket": "bluesky-client.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "xyz.blueskyweb.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_building_apk_only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 🛠️ Setup Local EAS CLI
        run: |
          pnpm add -g eas-cli

      - name: 🔨 Build Android APK via Local EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform android --profile development --local --output ./bluesky.apk --non-interactive

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluesky-Standalone-APK
          path: ./bluesky.apk
          retention-days: 14
